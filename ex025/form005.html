<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isexm" checked>Masculino <br>
            <input type="radio" name="sexo" id="isexf">Feminino <br>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <label for="iesfut"><input type="checkbox" name="esfut" id="iesfut" checked> Futebol<br></label>
            <label for="iesbas"><input type="checkbox" name="esfut" id="iesbas"> Basquete<br></label>
            <label for="iesvol"><input type="checkbox" name="esfut" id="iesvol"> Volei<br></label>
            <label for="iesatl"><input type="checkbox" name="esfut" id="iesatl"> Atletismo<br></label>
        </fieldset>



        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
