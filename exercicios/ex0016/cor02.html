<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <!-- * Representa a uma configuração global do CSS -->
    <style> 
        * { 
            height: 100%;
        }
        body {
            background-image: linear-gradient(45deg, #8B0BF6, #FC02D8, #FF0D47, #FF7B02, #FFC201);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
</body>
</html>
